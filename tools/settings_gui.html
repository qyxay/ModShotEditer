<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ModShot 控制面板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Microsoft YaHei", sans-serif; font-size: 13px; background: #fff; color: #000; display: flex; height: 100vh; overflow: hidden; }

/* 左侧导航 */
#sidebar { width: 280px; border-right: 1px solid #ccc; overflow-y: auto; flex-shrink: 0; }
.group-title { padding: 8px 12px; font-weight: bold; background: #f5f5f5; border-bottom: 1px solid #ddd; font-size: 12px; }
.nav-item { padding: 6px 12px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.nav-item:hover { background: #f0f0f0; }
.nav-item.active { background: #e0e0e0; border-left: 3px solid #000; }
.nav-item .sub { color: #666; font-size: 11px; }
.nav-btn { padding: 6px 12px; cursor: pointer; border-bottom: 1px solid #eee; color: #0066cc; font-size: 12px; }
.nav-btn:hover { background: #f0f0f0; }

/* 右侧编辑面板 */
#main { flex: 1; overflow-y: auto; padding: 16px; }
.panel-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #000; }
.section { margin-bottom: 16px; }
.section-title { font-weight: bold; margin-bottom: 8px; font-size: 13px; color: #333; }
.row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
label { min-width: 60px; }
input[type="number"], input[type="text"], select { padding: 4px 6px; border: 1px solid #ccc; font-size: 13px; width: 80px; }
input[type="text"] { width: 200px; }
button { padding: 5px 14px; border: 1px solid #999; background: #f5f5f5; cursor: pointer; font-size: 13px; }
button:hover { background: #e8e8e8; }
button.primary { background: #000; color: #fff; border-color: #000; }
button.primary:hover { background: #333; }
button.danger { color: #cc0000; border-color: #cc0000; }
.info-box { background: #f9f9f9; border: 1px solid #ddd; padding: 8px 12px; margin-bottom: 12px; font-family: monospace; font-size: 12px; }
.checkbox-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.event-page { border: 1px solid #ddd; margin-bottom: 8px; }
.event-page-header { background: #f5f5f5; padding: 6px 10px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; }
.event-page-body { padding: 8px 10px; display: none; }
.event-page-body.open { display: block; }
.cmd-row { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 4px; padding: 4px; border-bottom: 1px solid #eee; }
.cmd-code { font-family: monospace; color: #666; min-width: 50px; font-size: 11px; padding-top: 3px; }
.cmd-text { flex: 1; }
.cmd-text textarea { width: 100%; padding: 4px; border: 1px solid #ccc; font-size: 12px; font-family: monospace; resize: vertical; }
.empty { color: #999; padding: 20px; text-align: center; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="group-title">玩家</div>
  <div class="nav-item" data-panel="player" onclick="selectPanel('player')">
    <span>当前位置</span>
    <span class="sub" id="nav-player-pos">--</span>
  </div>

  <div class="group-title">地图落点</div>
  <div id="nav-map-spawns"></div>
  <div class="nav-btn" onclick="addCurrentMapSpawn()">+ 添加当前地图落点</div>

  <div class="group-title">事件 (当前地图)</div>
  <div id="nav-events"></div>
</div>

<div id="main">
  <div id="panel-content"></div>
</div>

<script>
const API = "http://127.0.0.1:8765";
let currentPanel = "player";
let currentData = { position: null, events: null, mapSpawns: {} };
let selectedEventId = null;
let selectedSpawnMap = null;

async function fetchJSON(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

async function postJSON(url, data) {
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });
    return await r.json();
  } catch(e) { return {error: e.message}; }
}

async function refreshData() {
  const [pos, evts, spawns] = await Promise.all([
    fetchJSON(API + "/current_position"),
    fetchJSON(API + "/current_events"),
    fetchJSON(API + "/map_spawn_points")
  ]);
  currentData.position = pos;
  currentData.events = evts;
  currentData.mapSpawns = spawns || {};
  renderSidebar();
  if (currentPanel) renderPanel();
}

function renderSidebar() {
  // 玩家位置
  if (currentData.position && currentData.position.player) {
    const p = currentData.position.player;
    document.getElementById("nav-player-pos").textContent = `m${p.map_id} (${p.x},${p.y})`;
  }

  // 地图落点
  const spawnDiv = document.getElementById("nav-map-spawns");
  spawnDiv.innerHTML = "";
  const currentMap = currentData.position ? currentData.position.player.map_id : null;
  Object.keys(currentData.mapSpawns).sort((a,b) => a-b).forEach(mapId => {
    const s = currentData.mapSpawns[mapId];
    const isCurrent = parseInt(mapId) === currentMap;
    const item = document.createElement("div");
    item.className = "nav-item" + (selectedSpawnMap == mapId ? " active" : "");
    item.innerHTML = `<span>地图 ${mapId}${isCurrent ? " (当前)" : ""}${s.enabled ? "" : " [关]"}</span><span class="sub">(${s.x},${s.y})</span>`;
    item.onclick = () => selectSpawn(mapId);
    spawnDiv.appendChild(item);
  });

  // 事件列表
  const evDiv = document.getElementById("nav-events");
  evDiv.innerHTML = "";
  if (currentData.events && currentData.events.events) {
    currentData.events.events.forEach(ev => {
      const item = document.createElement("div");
      item.className = "nav-item" + (selectedEventId === ev.id ? " active" : "");
      item.innerHTML = `<span>#${ev.id} ${ev.name}</span><span class="sub">(${ev.x},${ev.y})</span>`;
      item.onclick = () => selectEvent(ev.id);
      evDiv.appendChild(item);
    });
  } else {
    evDiv.innerHTML = '<div class="empty">游戏未运行</div>';
  }
}

function selectPanel(name) {
  currentPanel = name;
  selectedEventId = null;
  selectedSpawnMap = null;
  document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
  document.querySelector(`[data-panel="${name}"]`)?.classList.add("active");
  renderPanel();
}

function selectEvent(id) {
  currentPanel = "event";
  selectedEventId = id;
  selectedSpawnMap = null;
  renderSidebar();
  renderPanel();
}

function selectSpawn(mapId) {
  currentPanel = "spawn";
  selectedSpawnMap = mapId;
  selectedEventId = null;
  renderSidebar();
  renderPanel();
}

function renderPanel() {
  const c = document.getElementById("panel-content");
  if (currentPanel === "player") c.innerHTML = renderPlayerPanel();
  else if (currentPanel === "spawn") c.innerHTML = renderSpawnPanel();
  else if (currentPanel === "event") c.innerHTML = renderEventPanel();
  else c.innerHTML = '<div class="empty">选择左侧项目</div>';
}

// ===== 玩家位置面板 =====
function renderPlayerPanel() {
  const p = currentData.position ? currentData.position.player : null;
  if (!p) return '<div class="empty">游戏未运行</div>';
  return `
    <div class="panel-title">玩家位置</div>
    <div class="info-box">地图: ${p.map_id} | X: ${p.x} | Y: ${p.y} | 方向: ${p.dir_name} (${p.dir})</div>
    <div class="section">
      <div class="section-title">传送到</div>
      <div class="row">
        <label>地图ID</label><input type="number" id="goto-map" value="${p.map_id}">
        <label>X</label><input type="number" id="goto-x" value="${p.x}">
        <label>Y</label><input type="number" id="goto-y" value="${p.y}">
        <label>方向</label>
        <select id="goto-dir">
          <option value="2" ${p.dir==2?"selected":""}>下</option>
          <option value="4" ${p.dir==4?"selected":""}>左</option>
          <option value="6" ${p.dir==6?"selected":""}>右</option>
          <option value="8" ${p.dir==8?"selected":""}>上</option>
        </select>
        <button class="primary" onclick="doGoto()">传送</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">出生点 (新游戏开场)</div>
      <button onclick="setAsSpawn()">设为出生点</button>
      <span style="color:#666;margin-left:8px;">将当前位置写入 spawn_override (仅影响新游戏开场)</span>
    </div>
  `;
}

async function doGoto() {
  const data = {
    target: "player",
    map_id: parseInt(document.getElementById("goto-map").value),
    x: parseInt(document.getElementById("goto-x").value),
    y: parseInt(document.getElementById("goto-y").value),
    dir: parseInt(document.getElementById("goto-dir").value)
  };
  await postJSON(API + "/goto", data);
}

async function setAsSpawn() {
  const p = currentData.position.player;
  const settings = await fetchJSON(API + "/settings");
  if (settings && settings.spawn) {
    settings.spawn.enabled = true;
    settings.spawn.map_id = p.map_id;
    settings.spawn.x = p.x;
    settings.spawn.y = p.y;
    settings.spawn.dir = p.dir;
    await postJSON(API + "/settings", settings);
    alert("已设为出生点 (新游戏开场位置)");
  }
}

// ===== 地图落点面板 =====
function renderSpawnPanel() {
  if (!selectedSpawnMap) return '<div class="empty">选择一个地图落点</div>';
  const s = currentData.mapSpawns[selectedSpawnMap] || {enabled:true, x:0, y:0, dir:2};
  return `
    <div class="panel-title">地图落点 - 地图 ${selectedSpawnMap}</div>
    <div style="color:#666;margin-bottom:12px;">传送到达此地图时, 玩家将被放置到以下位置 (不受 autorun 事件移动影响)</div>
    <div class="section">
      <div class="checkbox-row">
        <input type="checkbox" id="spawn-enabled" ${s.enabled?"checked":""}>
        <label for="spawn-enabled" style="min-width:auto;">启用此落点</label>
      </div>
      <div class="row">
        <label>X</label><input type="number" id="spawn-x" value="${s.x}">
        <label>Y</label><input type="number" id="spawn-y" value="${s.y}">
        <label>方向</label>
        <select id="spawn-dir">
          <option value="2" ${s.dir==2?"selected":""}>下</option>
          <option value="4" ${s.dir==4?"selected":""}>左</option>
          <option value="6" ${s.dir==6?"selected":""}>右</option>
          <option value="8" ${s.dir==8?"selected":""}>上</option>
        </select>
      </div>
      <div class="row">
        <button class="primary" onclick="saveSpawn()">保存</button>
        <button onclick="useCurrentPos()">使用当前玩家位置</button>
        <button class="danger" onclick="deleteSpawn()">删除此落点</button>
      </div>
    </div>
  `;
}

async function saveSpawn() {
  const spawns = {...currentData.mapSpawns};
  spawns[selectedSpawnMap] = {
    enabled: document.getElementById("spawn-enabled").checked,
    x: parseInt(document.getElementById("spawn-x").value),
    y: parseInt(document.getElementById("spawn-y").value),
    dir: parseInt(document.getElementById("spawn-dir").value)
  };
  await postJSON(API + "/map_spawn_points", spawns);
  await refreshData();
}

async function useCurrentPos() {
  if (!currentData.position) return;
  const p = currentData.position.player;
  document.getElementById("spawn-x").value = p.x;
  document.getElementById("spawn-y").value = p.y;
  document.getElementById("spawn-dir").value = p.dir;
}

async function deleteSpawn() {
  if (!confirm(`确定删除地图 ${selectedSpawnMap} 的落点配置?`)) return;
  const spawns = {...currentData.mapSpawns};
  delete spawns[selectedSpawnMap];
  await postJSON(API + "/map_spawn_points", spawns);
  selectedSpawnMap = null;
  currentPanel = "player";
  await refreshData();
}

async function addCurrentMapSpawn() {
  if (!currentData.position) { alert("游戏未运行"); return; }
  const p = currentData.position.player;
  const mapId = p.map_id.toString();
  const spawns = {...currentData.mapSpawns};
  if (!spawns[mapId]) {
    spawns[mapId] = {enabled: true, x: p.x, y: p.y, dir: p.dir};
    await postJSON(API + "/map_spawn_points", spawns);
  }
  selectSpawn(mapId);
  await refreshData();
}

// ===== 事件编辑面板 =====
function renderEventPanel() {
  if (!selectedEventId || !currentData.events) return '<div class="empty">选择一个事件</div>';
  const ev = currentData.events.events.find(e => e.id === selectedEventId);
  if (!ev) return '<div class="empty">事件不存在</div>';

  let pagesHtml = ev.pages.map((page, pi) => {
    let cmdsHtml = page.commands.map((cmd, ci) => {
      const isDialog = (cmd.code === 101 || cmd.code === 401);
      const text = isDialog ? (cmd.parameters[0] || "") : "";
      return `
        <div class="cmd-row">
          <div class="cmd-code">cmd ${cmd.code}</div>
          <div class="cmd-text">
            ${isDialog ? `<textarea id="dialog-${pi}-${ci}" rows="2">${escapeHtml(text)}</textarea>
              <button onclick="saveDialog(${pi}, ${ci})">保存对话</button>` :
              `<span style="color:#666;font-size:11px;">${escapeHtml(JSON.stringify(cmd.parameters).substring(0,80))}</span>`}
          </div>
        </div>`;
    }).join("");

    return `
      <div class="event-page">
        <div class="event-page-header" onclick="togglePage(${pi})">
          <span>页 ${pi} - ${page.trigger_name}${page.through ? " [可通行]" : ""}</span>
          <span id="page-arrow-${pi}">+</span>
        </div>
        <div class="event-page-body" id="page-body-${pi}">
          <div style="margin-bottom:8px;font-size:12px;color:#666;">
            触发: ${page.trigger_name} | 优先级: ${page.priority_type} | 方向固定: ${page.direction_fix}
          </div>
          <div style="margin-bottom:8px;font-size:12px;">
            <b>条件:</b> ${renderCondition(page.condition)}
          </div>
          <div class="section-title" style="margin-top:8px;">命令列表</div>
          ${cmdsHtml || '<div style="color:#999;">空</div>'}
        </div>
      </div>`;
  }).join("");

  const ss = ev.self_switches;
  return `
    <div class="panel-title">事件 #${ev.id} - ${escapeHtml(ev.name)}</div>
    <div class="info-box">位置: (${ev.x}, ${ev.y}) | 方向: ${ev.dir} | 可通行: ${ev.through}</div>

    <div class="section">
      <div class="section-title">基本属性</div>
      <div class="row">
        <label>X</label><input type="number" id="ev-x" value="${ev.x}">
        <label>Y</label><input type="number" id="ev-y" value="${ev.y}">
        <label>方向</label>
        <select id="ev-dir">
          <option value="2" ${ev.dir==2?"selected":""}>下</option>
          <option value="4" ${ev.dir==4?"selected":""}>左</option>
          <option value="6" ${ev.dir==6?"selected":""}>右</option>
          <option value="8" ${ev.dir==8?"selected":""}>上</option>
        </select>
        <button onclick="moveEvent()">移动</button>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="ev-through" ${ev.through?"checked":""}>
        <label for="ev-through" style="min-width:auto;">可通行 (关闭碰撞)</label>
        <button onclick="setThrough()">应用</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Self Switch (对话阶段)</div>
      <div class="row">
        ${["A","B","C","D"].map(ch => `
          <div class="checkbox-row" style="margin-right:16px;">
            <input type="checkbox" id="ss-${ch}" ${ss[ch]?"checked":""}>
            <label for="ss-${ch}" style="min-width:auto;">${ch}</label>
            <button onclick="setSelfSwitch('${ch}')">设</button>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="section">
      <div class="section-title">事件页 (${ev.pages.length} 页)</div>
      ${pagesHtml}
    </div>
  `;
}

function renderCondition(c) {
  const parts = [];
  if (c.switch1_valid) parts.push(`开关${c.switch1_id}=ON`);
  if (c.switch2_valid) parts.push(`开关${c.switch2_id}=ON`);
  if (c.variable_valid) parts.push(`变量${c.variable_id}>=${c.variable_value}`);
  if (c.self_switch_valid) parts.push(`Self ${c.self_switch_ch}=ON`);
  return parts.length ? parts.join(", ") : "无条件";
}

function togglePage(pi) {
  const body = document.getElementById(`page-body-${pi}`);
  const arrow = document.getElementById(`page-arrow-${pi}`);
  body.classList.toggle("open");
  arrow.textContent = body.classList.contains("open") ? "-" : "+";
}

async function moveEvent() {
  await postJSON(API + "/event_modify", {
    op: "move_event",
    event_id: selectedEventId,
    x: parseInt(document.getElementById("ev-x").value),
    y: parseInt(document.getElementById("ev-y").value),
    dir: parseInt(document.getElementById("ev-dir").value)
  });
  setTimeout(refreshData, 500);
}

async function setThrough() {
  await postJSON(API + "/event_modify", {
    op: "set_through",
    event_id: selectedEventId,
    through: document.getElementById("ev-through").checked
  });
  setTimeout(refreshData, 500);
}

async function setSelfSwitch(ch) {
  await postJSON(API + "/event_modify", {
    op: "set_self_switch",
    event_id: selectedEventId,
    ch: ch,
    value: document.getElementById(`ss-${ch}`).checked
  });
  setTimeout(refreshData, 500);
}

async function saveDialog(pi, ci) {
  const text = document.getElementById(`dialog-${pi}-${ci}`).value;
  await postJSON(API + "/event_modify", {
    op: "set_dialog",
    event_id: selectedEventId,
    page_index: pi,
    command_index: ci,
    text: text
  });
  setTimeout(refreshData, 500);
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

// 初始化
refreshData();
setInterval(refreshData, 2000);
</script>
</body>
</html>
