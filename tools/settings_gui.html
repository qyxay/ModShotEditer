<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ModShot 设置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #fff;
    color: #333;
    font-size: 14px;
  }
  .header {
    padding: 10px 16px;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { font-size: 15px; font-weight: normal; }
  .status { font-size: 12px; color: #888; }
  .status.saved { color: #4caf50; }
  .status.saving { color: #ff9800; }
  .status.error { color: #f44336; }

  .tabs {
    display: flex;
    border-bottom: 1px solid #ddd;
    padding: 0 8px;
  }
  .tabs button {
    background: none;
    border: none;
    padding: 8px 14px;
    font-size: 13px;
    color: #666;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tabs button:hover { color: #333; }
  .tabs button.active {
    color: #333;
    border-bottom-color: #999;
  }

  .content { padding: 12px 16px; }
  .group { display: none; }
  .group.active { display: block; }

  .row {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f0f0f0;
    gap: 12px;
  }
  .row:last-child { border-bottom: none; }
  .row .label { flex: 1; min-width: 0; }
  .row .label .name { font-size: 14px; }
  .row .label .key { font-size: 11px; color: #999; font-family: monospace; }
  .row .label .help { font-size: 12px; color: #888; margin-top: 2px; }
  .row .control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  input[type="number"] {
    width: 70px;
    padding: 4px 6px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 13px;
    text-align: center;
  }
  input[type="range"] { width: 100px; }
  input[type="text"] {
    width: 160px;
    padding: 4px 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 13px;
  }
  select {
    padding: 4px 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 13px;
    background: #fff;
  }
  input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

  .reset-btn {
    background: none;
    border: 1px solid #ddd;
    color: #999;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 11px;
    cursor: pointer;
  }
  .reset-btn:hover { border-color: #999; color: #666; }

  .loading, .error {
    padding: 40px;
    text-align: center;
    color: #888;
  }
  .error { color: #f44336; }
  .error code { background: #f5f5f5; padding: 1px 4px; border-radius: 2px; }

  .footer {
    padding: 8px 16px;
    border-top: 1px solid #ddd;
    font-size: 11px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <h1>ModShot 运行时设置</h1>
  <div class="status" id="status">就绪</div>
</div>

<div class="tabs" id="tabs"></div>

<div class="content" id="content">
  <div class="loading">加载中...</div>
</div>

<div class="footer">修改自动保存，游戏运行时自动热重载</div>

<script>
let schema = null, values = {}, activeCat = null, saveTimer = null;
const $ = id => document.getElementById(id);

function setStatus(text, cls) {
  const el = $("status");
  el.textContent = text;
  el.className = "status " + (cls || "");
}

async function load() {
  setStatus("加载中...", "saving");
  try {
    const [sr, vr] = await Promise.all([fetch("/schema"), fetch("/settings")]);
    if (sr.ok) {
      schema = await sr.json();
      values = await vr.json().catch(() => ({}));
      setStatus("已加载", "saved");
    } else {
      // schema 不存在时也显示位置面板 (位置功能不依赖 schema)
      schema = {categories: [], settings: []};
      values = {};
      setStatus("schema未生成(位置可用)", "saving");
    }
    render();
    refreshPosition();
    setInterval(refreshPosition, 1500);  // 自动刷新当前位置
  } catch (e) {
    showError("连接失败: " + e.message);
  }
}

function showError(msg) {
  $("content").innerHTML = `<div class="error"><b>加载失败</b><br><br>${msg}<br><br>请确认: ① 已启动游戏一次（生成 schema.json）<br>② 服务器正在运行</div>`;
  setStatus("错误", "error");
}

function render() {
  const tabs = $("tabs");
  tabs.innerHTML = "";

  // 位置 tab (硬编码, 不在 schema 里)
  const posBtn = document.createElement("button");
  posBtn.textContent = "位置";
  posBtn.classList.add("active");
  activeCat = "位置";
  posBtn.onclick = () => switchTab("位置");
  tabs.appendChild(posBtn);

  schema.categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.textContent = cat;
    btn.onclick = () => switchTab(cat);
    tabs.appendChild(btn);
  });

  const content = $("content");
  content.innerHTML = "";

  // 位置面板
  content.appendChild(renderPositionPanel());

  schema.categories.forEach(cat => {
    const group = document.createElement("div");
    group.className = "group";
    group.dataset.cat = cat;
    schema.settings.filter(s => s.category === cat).forEach(d => group.appendChild(renderRow(d)));
    content.appendChild(group);
  });
}

function switchTab(cat) {
  activeCat = cat;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.textContent === cat));
  document.querySelectorAll(".group").forEach(g => g.classList.toggle("active", g.dataset.cat === cat));
}

function renderPositionPanel() {
  const group = document.createElement("div");
  group.className = "group active";
  group.dataset.cat = "位置";
  group.innerHTML = `
    <div class="row">
      <div class="label">
        <div class="name">玩家当前位置</div>
        <div class="key" id="pos-player">等待游戏数据...</div>
        <div class="help" id="pos-time"></div>
      </div>
      <div class="control">
        <button class="reset-btn" onclick="refreshPosition()" style="padding:4px 10px">刷新</button>
      </div>
    </div>
    <div class="row">
      <div class="label">
        <div class="name">传送玩家到</div>
        <div class="help">跨地图传送, 输入目标位置后点击传送</div>
      </div>
      <div class="control">
        <input type="number" id="goto-map" placeholder="地图" style="width:60px">
        <input type="number" id="goto-x" placeholder="X" style="width:50px">
        <input type="number" id="goto-y" placeholder="Y" style="width:50px">
        <select id="goto-dir" style="width:56px">
          <option value="2">下</option><option value="4">左</option>
          <option value="6">右</option><option value="8">上</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="label"><div class="help">传送立即生效; 设为出生点修改 spawn_override (新游戏开场生效)</div></div>
      <div class="control">
        <button class="reset-btn" onclick="doGoto()" style="padding:4px 14px">传送</button>
        <button class="reset-btn" onclick="setSpawnFromCurrent()" style="padding:4px 14px">设为出生点</button>
      </div>
    </div>
    <div class="row">
      <div class="label">
        <div class="name">当前地图事件</div>
        <div class="help" id="event-count">等待游戏数据...</div>
      </div>
      <div class="control">
        <select id="event-select" style="width:200px" onchange="onEventSelect()">
          <option value="">-- 选择事件 --</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="label">
        <div class="name">移动事件到</div>
        <div class="help">仅在当前地图内移动事件位置</div>
      </div>
      <div class="control">
        <input type="number" id="event-x" placeholder="X" style="width:50px">
        <input type="number" id="event-y" placeholder="Y" style="width:50px">
        <select id="event-dir" style="width:56px">
          <option value="2">下</option><option value="4">左</option>
          <option value="6">右</option><option value="8">上</option>
        </select>
        <button class="reset-btn" onclick="doMoveEvent()" style="padding:4px 14px">移动</button>
      </div>
    </div>`;
  return group;
}

let currentData = null;
async function refreshPosition() {
  try {
    const r = await fetch("/current_position");
    if (r.ok) {
      currentData = await r.json();
      const p = currentData.player || {};
      $("pos-player").textContent = `地图 ${p.map_id}  (${p.x}, ${p.y})  方向: ${p.dir_name || p.dir}`;
      $("pos-time").textContent = `更新于 ${currentData.updated_at || ""}`;

      const events = currentData.events || [];
      $("event-count").textContent = `共 ${events.length} 个事件`;
      const sel = $("event-select");
      const prev = sel.value;
      sel.innerHTML = '<option value="">-- 选择事件 --</option>';
      events.forEach(ev => {
        const opt = document.createElement("option");
        opt.value = ev.id;
        opt.textContent = `#${ev.id} ${ev.name} (${ev.x},${ev.y}) ${ev.dir_name || ""}`;
        sel.appendChild(opt);
      });
      sel.value = prev;
    } else {
      $("pos-player").textContent = "游戏未运行或位置未同步";
    }
  } catch (e) {
    $("pos-player").textContent = "连接失败";
  }
}

function onEventSelect() {
  const id = parseInt($("event-select").value);
  if (!id || !currentData) return;
  const ev = (currentData.events || []).find(e => e.id === id);
  if (ev) {
    $("event-x").value = ev.x;
    $("event-y").value = ev.y;
    $("event-dir").value = ev.dir;
  }
}

async function doMoveEvent() {
  const event_id = parseInt($("event-select").value);
  const x = parseInt($("event-x").value);
  const y = parseInt($("event-y").value);
  const dir = parseInt($("event-dir").value);
  if (!event_id || isNaN(x) || isNaN(y)) {
    alert("请先选择事件并填写 X、Y 坐标");
    return;
  }
  try {
    await fetch("/goto", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({target: "event", event_id, x, y, dir})
    });
    setStatus("事件移动请求已发送", "saved");
    setTimeout(refreshPosition, 500);
  } catch (e) {
    setStatus("移动失败", "error");
  }
}

async function doGoto() {
  const map_id = parseInt($("goto-map").value);
  const x = parseInt($("goto-x").value);
  const y = parseInt($("goto-y").value);
  const dir = parseInt($("goto-dir").value);
  if (!map_id || isNaN(x) || isNaN(y)) {
    alert("请填写完整的地图ID、X、Y坐标");
    return;
  }
  try {
    await fetch("/goto", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({target: "player", map_id, x, y, dir})
    });
    setStatus("传送请求已发送", "saved");
  } catch (e) {
    setStatus("传送失败", "error");
  }
}

async function setSpawnFromCurrent() {
  if (!currentData || !currentData.player) {
    alert("请先刷新获取当前位置");
    return;
  }
  const p = currentData.player;
  values["spawn.enabled"] = true;
  values["spawn.map_id"] = p.map_id;
  values["spawn.x"] = p.x;
  values["spawn.y"] = p.y;
  values["spawn.dir"] = p.dir;
  scheduleSave();
  alert(`已设为出生点: 地图${p.map_id} (${p.x},${p.y})`);
}

function renderRow(def) {
  const row = document.createElement("div");
  row.className = "row";
  const val = values[def.key] !== undefined ? values[def.key] : def.default;
  let ctrl = "";
  switch (def.type) {
    case "bool":
      ctrl = `<input type="checkbox" data-key="${def.key}" ${val ? "checked" : ""}>`;
      break;
    case "int": case "float": {
      const step = def.type === "int" ? 1 : 0.1;
      ctrl = `<input type="range" min="${def.min ?? 0}" max="${def.max ?? 100}" step="${step}" value="${val}" data-key="${def.key}" data-type="range">
               <input type="number" min="${def.min ?? ""}" max="${def.max ?? ""}" step="${step}" value="${val}" data-key="${def.key}" data-type="number">`;
      break;
    }
    case "enum":
      ctrl = `<select data-key="${def.key}">${(def.options || []).map(([v,l]) => `<option value="${v}" ${v===val?"selected":""}>${l}</option>`).join("")}</select>`;
      break;
    case "string":
      ctrl = `<input type="text" value="${String(val).replace(/"/g,'&quot;')}" data-key="${def.key}">`;
      break;
  }
  row.innerHTML = `
    <div class="label">
      <div class="name">${def.label}</div>
      <div class="key">${def.key}</div>
      ${def.help ? `<div class="help">${def.help}</div>` : ""}
    </div>
    <div class="control">${ctrl}<button class="reset-btn" data-reset="${def.key}" title="重置默认">↺</button></div>`;

  row.querySelectorAll("[data-key]").forEach(el => {
    if (def.type === "bool") {
      el.addEventListener("change", () => onChange(def, el.checked));
    } else {
      el.addEventListener("change", () => onChange(def, parseVal(def, el.value)));
    }
    if (el.dataset.type === "range") {
      el.addEventListener("input", () => {
        const n = row.querySelector(`input[type="number"][data-key="${def.key}"]`);
        if (n) n.value = el.value;
      });
    }
    if (el.dataset.type === "number") {
      el.addEventListener("input", () => {
        const r = row.querySelector(`input[type="range"][data-key="${def.key}"]`);
        if (r) r.value = el.value;
      });
    }
  });
  row.querySelector("[data-reset]").addEventListener("click", () => {
    values[def.key] = def.default;
    render();
    scheduleSave();
  });
  return row;
}

function parseVal(def, raw) {
  switch (def.type) {
    case "int": return parseInt(raw) || 0;
    case "float": return parseFloat(raw) || 0;
    case "enum": return parseInt(raw) || raw;
    default: return raw;
  }
}

function onChange(def, val) {
  values[def.key] = val;
  scheduleSave();
}

function scheduleSave() {
  setStatus("保存中...", "saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}

async function save() {
  try {
    const r = await fetch("/settings", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(values)
    });
    setStatus(r.ok ? "已保存" : "保存失败", r.ok ? "saved" : "error");
  } catch (e) {
    setStatus("保存失败", "error");
  }
}

load();
</script>
</body>
</html>
