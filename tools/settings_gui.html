<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModShot 设置</title>
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --card: #0f3460;
    --accent: #e94560;
    --accent2: #533483;
    --text: #eaeaea;
    --text-dim: #8892b0;
    --border: #2a2a4a;
    --success: #4caf50;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  /* 自定义标题栏 (装饰, --app 模式下系统标题栏仍在) */
  .titlebar {
    background: linear-gradient(90deg, var(--accent2), var(--bg2));
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--accent);
    -webkit-app-region: drag;
  }
  .titlebar .title {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
  }
  .titlebar .title span { color: var(--text-dim); font-weight: 400; margin-left: 6px; font-size: 11px; }
  .titlebar .status {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    background: rgba(0,0,0,0.3);
    color: var(--text-dim);
    -webkit-app-region: no-drag;
  }
  .titlebar .status.saved { background: var(--success); color: #fff; }
  .titlebar .status.saving { background: #ff9800; color: #fff; }
  .titlebar .status.error { background: var(--accent); color: #fff; }

  /* 分类 tab */
  nav.tabs {
    display: flex;
    gap: 0;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
    overflow-x: auto;
  }
  nav.tabs button {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 10px 18px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }
  nav.tabs button:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* 主体滚动区 */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-track { background: var(--bg); }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  main::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

  .setting-group { display: none; }
  .setting-group.active { display: block; }

  .setting-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: border-color 0.15s;
  }
  .setting-item:hover { border-color: var(--accent2); }
  .setting-info { flex: 1; min-width: 0; }
  .setting-label { font-size: 14px; font-weight: 500; }
  .setting-key { font-size: 10px; color: var(--text-dim); font-family: monospace; margin-top: 1px; }
  .setting-help { font-size: 11px; color: var(--text-dim); margin-top: 3px; line-height: 1.4; }
  .setting-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* Toggle */
  .toggle {
    position: relative; width: 42px; height: 22px;
    background: var(--border); border-radius: 11px;
    cursor: pointer; transition: background 0.2s;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; background: #fff; border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); }

  input[type="number"] {
    width: 64px; padding: 5px 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-size: 13px; text-align: center;
  }
  input[type="number"]:focus { outline: none; border-color: var(--accent); }
  input[type="range"] { width: 100px; accent-color: var(--accent); cursor: pointer; }

  select {
    padding: 5px 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); font-size: 13px; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  input[type="text"] {
    width: 160px; padding: 5px 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-size: 13px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  .reset-btn {
    background: none; border: 1px solid var(--border);
    color: var(--text-dim); padding: 3px 7px; border-radius: 4px;
    font-size: 11px; cursor: pointer; transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  footer {
    background: var(--bg2);
    padding: 6px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 10px;
    border-top: 1px solid var(--border);
  }
  footer code { background: var(--bg); padding: 1px 4px; border-radius: 2px; font-family: monospace; }

  .loading { text-align: center; padding: 60px; color: var(--text-dim); font-size: 15px; }
  .error-box {
    background: rgba(233,69,96,0.08); border: 1px solid var(--accent);
    border-radius: 8px; padding: 24px; margin: 20px; color: var(--text);
  }
  .error-box h3 { color: var(--accent); margin-bottom: 10px; }
  .error-box p { font-size: 13px; line-height: 1.7; }
  .error-box code { background: var(--bg); padding: 2px 6px; border-radius: 3px; font-family: monospace; }
</style>
</head>
<body>

<div class="titlebar">
  <div class="title">MODSHOT<span>运行时设置</span></div>
  <div class="status" id="status">就绪</div>
</div>

<nav class="tabs" id="tabs"></nav>

<main id="main">
  <div class="loading">正在加载设置...</div>
</main>

<footer>
  修改自动保存到 <code>runtime.json</code> · 游戏自动热重载 · 新增设置只需游戏端 <code>register</code>
</footer>

<script>
let schema = null, values = {}, activeCategory = null, saveTimer = null;
const $ = id => document.getElementById(id);

function setStatus(text, cls = "") {
  const el = $("status");
  el.textContent = text;
  el.className = "status " + cls;
}

async function loadData() {
  setStatus("加载中...", "saving");
  try {
    const [sr, vr] = await Promise.all([fetch("/schema"), fetch("/settings")]);
    if (!sr.ok) {
      const e = await sr.json().catch(() => ({}));
      showError(e.error || "schema.json 不存在");
      return;
    }
    schema = await sr.json();
    values = await vr.json().catch(() => ({}));
    render();
    setStatus("已加载 ✓", "saved");
  } catch (e) {
    showError("连接服务器失败: " + e.message);
  }
}

function showError(msg) {
  $("main").innerHTML = `
    <div class="error-box">
      <h3>加载失败</h3>
      <p>${msg}</p>
      <p style="margin-top:12px">请确认: ① 已运行 <code>python tools/settings_server.py</code><br>② 已启动游戏至少一次（生成 schema.json）</p>
    </div>`;
  setStatus("错误", "error");
}

function render() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  schema.categories.forEach((cat, i) => {
    const btn = document.createElement("button");
    btn.textContent = cat;
    if (i === 0) { btn.classList.add("active"); activeCategory = cat; }
    btn.onclick = () => {
      activeCategory = cat;
      document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.textContent === cat));
      document.querySelectorAll(".setting-group").forEach(g => g.classList.toggle("active", g.dataset.cat === cat));
    };
    tabs.appendChild(btn);
  });

  const main = $("main");
  main.innerHTML = "";
  schema.categories.forEach(cat => {
    const group = document.createElement("div");
    group.className = "setting-group" + (cat === activeCategory ? " active" : "");
    group.dataset.cat = cat;
    schema.settings.filter(s => s.category === cat).forEach(d => group.appendChild(renderItem(d)));
    main.appendChild(group);
  });
}

function renderItem(def) {
  const item = document.createElement("div");
  item.className = "setting-item";
  const val = values[def.key] !== undefined ? values[def.key] : def.default;
  let ctrl = "";
  switch (def.type) {
    case "bool":
      ctrl = `<div class="toggle ${val ? "on" : ""}" data-key="${def.key}"></div>`; break;
    case "int": case "float": {
      const step = def.type === "int" ? 1 : 0.1;
      ctrl = `<input type="range" min="${def.min ?? 0}" max="${def.max ?? 100}" step="${step}" value="${val}" data-key="${def.key}" data-type="range">
               <input type="number" min="${def.min ?? ""}" max="${def.max ?? ""}" step="${step}" value="${val}" data-key="${def.key}" data-type="number">`;
      break;
    }
    case "enum":
      ctrl = `<select data-key="${def.key}">${(def.options || []).map(([v,l]) => `<option value="${v}" ${v===val?"selected":""}>${l}</option>`).join("")}</select>`;
      break;
    case "string":
      ctrl = `<input type="text" value="${String(val).replace(/"/g,'&quot;')}" data-key="${def.key}">`; break;
  }
  item.innerHTML = `
    <div class="setting-info">
      <div class="setting-label">${def.label}</div>
      <div class="setting-key">${def.key}</div>
      ${def.help ? `<div class="setting-help">${def.help}</div>` : ""}
    </div>
    <div class="setting-control">${ctrl}<button class="reset-btn" data-reset="${def.key}" title="重置默认">↺</button></div>`;

  item.querySelectorAll("[data-key]").forEach(el => {
    if (def.type === "bool") {
      el.addEventListener("click", () => { el.classList.toggle("on"); onChange(def, el); });
    } else {
      el.addEventListener("change", () => onChange(def, el));
      if (el.dataset.type === "range") {
        el.addEventListener("input", () => {
          const n = item.querySelector(`input[type="number"][data-key="${def.key}"]`);
          if (n) n.value = el.value;
        });
      }
      if (el.dataset.type === "number") {
        el.addEventListener("input", () => {
          const r = item.querySelector(`input[type="range"][data-key="${def.key}"]`);
          if (r) r.value = el.value;
        });
      }
    }
  });
  item.querySelector("[data-reset]").addEventListener("click", () => {
    values[def.key] = def.default;
    render();
    scheduleSave();
  });
  return item;
}

function onChange(def, el) {
  let v;
  switch (def.type) {
    case "bool": v = el.classList.contains("on"); break;
    case "int": v = parseInt(el.value) || 0; break;
    case "float": v = parseFloat(el.value) || 0; break;
    case "enum": v = parseInt(el.value) || el.value; break;
    case "string": v = el.value; break;
  }
  values[def.key] = v;
  scheduleSave();
}

function scheduleSave() {
  setStatus("保存中...", "saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}

async function save() {
  try {
    const r = await fetch("/settings", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(values) });
    setStatus(r.ok ? "已保存 ✓" : "保存失败", r.ok ? "saved" : "error");
  } catch (e) { setStatus("保存失败", "error"); }
}

loadData();
</script>
</body>
</html>
